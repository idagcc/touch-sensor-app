name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test native macOS player
        run: swift test
      - name: Build universal macOS app with demo media
        run: bash scripts/build-app.sh
      - name: Verify app signature and architectures
        run: |
          codesign --verify --deep --strict "dist/Touch Player.app"
          lipo -archs "dist/Touch Player.app/Contents/MacOS/TouchPlayer"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-build
          path: dist/TouchPlayer-macOS.zip
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Windows/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Serial, command, configuration and recovery tests
        run: npm test
      - name: Actual video play/pause/resume/reset smoke test
        run: npm run smoke
        timeout-minutes: 3
      - name: Build Windows installer and portable ZIP
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build
          path: |
            Windows/release/*.exe
            Windows/release/*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-build'
          merge-multiple: true
          path: release-assets
      - name: Publish platform builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*
          --verify-tag --title "Touch Player $GITHUB_REF_NAME"
          --notes-file RELEASE_NOTES.md
